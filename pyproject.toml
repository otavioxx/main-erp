[tool.ruff]
target-version = "py310"
extend-exclude = ["main.spec"]

[tool.ruff.lint]
# Regras ligadas: erros reais (F, B, E4/E7/E9), imports ordenados (I) e as
# famílias de "exceção" que já foram zeradas (não deixe voltar).
select = [
    "E4", "E7", "E9", "F", "B", "I",
    "S110", "S112",              # try/except/pass e try/except/continue
    "TRY002", "TRY201", "TRY203",  # raise Exception(...), raise e, handler inútil
    "RUF012", "RUF013", "RUF059",  # tipos e variáveis não usadas
    "PLW1510",                   # subprocess.run sem check=
    "SIM102", "SIM103", "SIM117",  # if/with desnecessariamente aninhados
    "UP036",                     # bloco de versão obsoleto
]
ignore = [
    # 158 ocorrências restantes são limites de recuperação/propagação. As capturadas
    # são registradas pelo logging central; casos previsíveis devem usar tipos específicos.
    # Para ver a dívida: ruff check --select BLE001 --statistics
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# main.py precisa chamar paths.preparar_ambiente() ANTES de importar o resto
# (os módulos leem a pasta de dados na importação); instalar.py ajusta o sys.path.
"main.py" = ["E402"]
"distribuicao/instalar.py" = ["E402"]
