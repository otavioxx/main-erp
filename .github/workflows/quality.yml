name: Qualidade

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar bibliotecas do Qt
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1
      - run: python -m pip install -r requirements-dev.txt
      - run: MAINERP_DATA="$RUNNER_TEMP/pluma-dados" python -m pytest
