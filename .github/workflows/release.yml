name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python distribuicao/criar_release.py --verificar-tag "$RELEASE_TAG"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build ZIP and SHA256 manifest
        run: |
          python distribuicao/criar_release.py
          python distribuicao/criar_instalador.py
          (cd dist && sha256sum "MainERP-Instalador-${GITHUB_REF_NAME#v}.pyz" > instalador.sha256)

      - name: Sign release packages with Ed25519
        env:
          MAINERP_ED25519_PRIVATE_KEY: ${{ secrets.MAINERP_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python distribuicao/assinar_release.py "dist/MainERP-${RELEASE_TAG#v}.zip"
          python distribuicao/assinar_release.py "dist/MainERP-Instalador-${RELEASE_TAG#v}.pyz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${RELEASE_TAG#v}" '
            index($0, "## [" version "] - ") == 1 ||
            index($0, "## " version " - ") == 1 {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.txt

          grep -Eq '^[-*] ' release-notes.txt || {
            echo "Seção da versão ausente ou sem alterações em CHANGELOG.md" >&2
            exit 1
          }

          gh release create "$RELEASE_TAG" \
            "dist/MainERP-${RELEASE_TAG#v}.zip" \
            "dist/MainERP-${RELEASE_TAG#v}.zip.sig" \
            "dist/MainERP-Instalador-${RELEASE_TAG#v}.pyz" \
            "dist/MainERP-Instalador-${RELEASE_TAG#v}.pyz.sig" \
            dist/instalador.sha256 \
            dist/version.json \
            --verify-tag \
            --title "MainERP ${RELEASE_TAG#v}" \
            --notes-file release-notes.txt \
            --latest
