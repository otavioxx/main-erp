name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("mainerp/core/config.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', source)
          if match is None:
              raise SystemExit("APP_VERSION was not found")

          expected_tag = f"v{match.group(1)}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"Tag {os.environ['RELEASE_TAG']} does not match {expected_tag}"
              )
          PY

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build ZIP and SHA256 manifest
        run: python distribuicao/criar_release.py

      - name: Sign release ZIP with Ed25519
        env:
          MAINERP_ED25519_PRIVATE_KEY: ${{ secrets.MAINERP_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python distribuicao/assinar_release.py "dist/MainERP-${RELEASE_TAG#v}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/MainERP-${RELEASE_TAG#v}.zip" \
            "dist/MainERP-${RELEASE_TAG#v}.zip.sig" \
            dist/version.json \
            --verify-tag \
            --title "MainERP ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest
