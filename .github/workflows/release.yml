name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python distribuicao/criar_release.py --verificar-tag "$RELEASE_TAG"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build ZIP and SHA256 manifest
        run: python distribuicao/criar_release.py

      - name: Sign release ZIP with Ed25519
        env:
          MAINERP_ED25519_PRIVATE_KEY: ${{ secrets.MAINERP_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python distribuicao/assinar_release.py "dist/MainERP-${RELEASE_TAG#v}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/MainERP-${RELEASE_TAG#v}.zip" \
            "dist/MainERP-${RELEASE_TAG#v}.zip.sig" \
            dist/version.json \
            --verify-tag \
            --title "MainERP ${RELEASE_TAG#v}" \
            --generate-notes \
            --latest
